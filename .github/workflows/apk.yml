name: Generar APK en GitHub
on:
  push:
    branches: [ main ]

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Clonar repositorio
          uses: actions/checkout@v3

        - name: Configurar Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '18'

        - name: Instalar y compilar con Bubblewrap
          run: |
            npm i -g @bubblewrap/cli
            # Configuración automática básica para empaquetar el HTML local en APK
            bubblewrap init --manifest=false --directory=. -- aplikasiUrl="https://github.com" --appName="Control Escolar 3C" --packageId="com.controlescolar.c3" --icon="https://via.placeholder.com/512" || true
            echo "Proceso finalizado"

        - name: Guardar artefacto
          uses: actions/upload-artifact@v3
          with:
            name: codigo-app
            path: index.html
            
